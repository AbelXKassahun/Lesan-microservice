static_resources:
  listeners:
    - name: listener_0
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: local_services
                      domains: ["*"]
                      routes:
                        # User            
                        - match:
                            prefix: "/api/user"
                          route:
                            cluster: user-service

                        # Gamification Service
                        - match:
                            prefix: "/api/game-service"
                          route:
                            cluster: gamification-service

                        # Speech models
                        # - match:
                        #     prefix: "/api/models"
                        #   route:
                        #     cluster: amharic-speech-service

                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: user-service
      connect_timeout: 0.25s
      type: logical_dns
      lb_policy: round_robin
      load_assignment:
        cluster_name: user-service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: host.docker.internal
                      # port_value: 5168
                      port_value: 5080

    - name: gamification-service
      connect_timeout: 0.25s
      type: logical_dns
      lb_policy: round_robin
      load_assignment:
        cluster_name: gamification-service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: host.docker.internal
                      # port_value: 5144
                      port_value: 8082

    # - name: amharic-speech-service
